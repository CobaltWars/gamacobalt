<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance Planifiée</title>
  <link rel="icon" type="image/x-icon" href="Ressources/favicon.ico">
  <style>
    body {
  font-family: 'Arial', sans-serif;
  background-color: #f0f8ff; /* Light blue background */
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden; /* Hide scrollbars */
}

.container {
  background-color: #fff;
  border-radius: 10px;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
  padding: 30px;
  text-align: center;
  width: 80%;
  max-width: 600px;
  position: relative; /* For gear positioning */
  z-index: 1; /* Ensure content is above gears */
}

h1 {
  color: #333;
  margin-bottom: 20px;
}

p {
  color: #666;
  font-size: 1.1em;
  line-height: 1.6;
  margin-bottom: 25px;
}

.button {
  display: inline-block;
  padding: 12px 24px;
  background-color: #007BFF; /* Primary blue button */
  color: white;
  text-decoration: none;
  border-radius: 5px;
  font-size: 1.1em;
  transition: background-color 0.3s ease;
}

.button:hover {
  background-color: #0056b3;
}

/* Gear styles */
.gears {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  pointer-events: none; /* Make sure they don't interfere with clicking */
  z-index: 0; /* Place behind the content */
}

.gear {
  position: absolute;
  width: 50px; /* Increased size for better visibility */
  height: 50px;
  color: #87CEEB; /* Light Sky Blue for gears */
  opacity: 0.7;
  animation: rotate 10s linear infinite; /* Slower rotation */
}

.gear:nth-child(1) {
  left: 10%;
  top: 10%;
  animation-delay: 0s;
  width: 40px;
  height: 40px;
}

.gear:nth-child(2) {
  left: 20%;
  top: 60%;
  width: 60px;
  height: 60px;
  animation-delay: 1s;
}

.gear:nth-child(3) {
  left: 30%;
  top: 20%;
  animation-delay: 2s;
  width: 50px;
  height: 50px;
}

.gear:nth-child(4) {
  left: 40%;
  top: 70%;
  width: 70px;
  height: 70px;
  animation-delay: 0s;
}

.gear:nth-child(5) {
  left: 50%;
  top: 30%;
  animation-delay: 3s;
  width: 45px;
  height: 45px;
}

.gear:nth-child(6) {
  left: 60%;
  top: 80%;
  width: 55px;
  height: 55px;
  animation-delay: 2s;
}

.gear:nth-child(7) {
  left: 70%;
  top: 15%;
  animation-delay: 1s;
  width: 65px;
  height: 65px;
}

.gear:nth-child(8) {
  left: 80%;
  top: 65%;
  width: 40px;
  height: 40px;
  animation-delay: 0s;
}

.gear:nth-child(9) {
  left: 90%;
  top: 25%;
  animation-delay: 3s;
  width: 50px;
  height: 50px;
}

.gear:nth-child(10) {
  left: 5%;
  top: 75%;
  width: 60px;
  height: 60px;
  animation-delay: 4s;
}

@keyframes rotate {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

/* Header Gear styles */
.gears-header {
    position: absolute;
    top: -40px;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 100px;
    z-index: 2; /* Ensure it's above the content */
}

.gear-header {
    font-size: 80px;
    color: #87CEEB;
    opacity: 0.7;
    animation: rotate 15s linear infinite;
}
  </style>
</head>
<body>
  <div class="container">
    <div class="gears-header" aria-hidden="true">
        <div class="gear-header">
          ⚙
        </div>
      </div>
    <div class="message">
      <h1>Maintenance Planifiée</h1>
      <p>Notre site sera en maintenance vers le début des vacances. Nous reviendrons vite, avec plus de renouveau !</p>
    </div>
    <a href="index2.html" class="button">Aller sur GamaCobalt</a>
  </div>
</body>
</html>
